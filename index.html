<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#9333ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cosmic Cannabis" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cosmic Cannabis" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="Cosmic Cannabis" />
    <meta property="og:description" content="Premium medical marijuana dispensary with psychedelic vibes" />
    <meta
      property="og:image"
      content="https://mocha-cdn.com/og.png"
      type="image/png"
    />
    <meta
      property="og:url"
      content="https://getmocha.com"
    />
    <meta property="og:type" content="website" />
    <meta property="og:author" content="Cosmic Cannabis" />
    <meta property="og:site_name" content="Cosmic Cannabis" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:site" content="@cosmic_cannabis" />
    <meta property="twitter:title" content="Cosmic Cannabis" />
    <meta property="twitter:description" content="Premium medical marijuana dispensary with psychedelic vibes" />
    <meta
      property="twitter:image"
      content="https://mocha-cdn.com/og.png"
      type="image/png"
    />
    <link
      rel="shortcut icon"
      href="https://mocha-cdn.com/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://mocha-cdn.com/apple-touch-icon.png"
      type="image/png"
    />
    <title>Cosmic Cannabis</title>
  </head>
  <body>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
